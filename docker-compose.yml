services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yompi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yompi_admin
      POSTGRES_PASSWORD: yompi_password
      POSTGRES_DB: yompi_db
    ports:
      - "5432:5432"
    volumes:
      - yompi_pgdata:/var/lib/postgresql/data

  # Dev-only mail catcher: SMTP on 1025, inbox UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: yompi-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  yompi_pgdata:
